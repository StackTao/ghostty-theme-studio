# ============================================================
# 风格：极光流光魅紫（Aura 电光魅紫 + 极光边框 + 彗星拖尾）
# 氛围：深邃暗紫底色搭配薄荷电绿与魅紫高亮，窗口四周泛起呼吸感流光极光边框
# 优化点：修复 Aura 内置选区过艳问题，并叠加动态极光边框与光标彗星拖尾
# ============================================================

background = #15141b
foreground = #edecee
cursor-color = #a277ff
cursor-text = #15141b
selection-background = #362b59
selection-foreground = #ffffff

palette = 0=#110f18
palette = 1=#ff6767
palette = 2=#61ffca
palette = 3=#ffca85
palette = 4=#a277ff
palette = 5=#f694ff
palette = 6=#61ffca
palette = 7=#edecee
palette = 8=#6d6d6d
palette = 9=#ff8585
palette = 10=#85ffd6
palette = 11=#ffd8a3
palette = 12=#bc9bff
palette = 13=#fab5ff
palette = 14=#8afce0
palette = 15=#ffffff

background-opacity = 0.92
background-blur = 20
window-colorspace = display-p3
alpha-blending = linear-corrected
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
font-thicken = true
cursor-style = block
cursor-style-blink = false
unfocused-split-opacity = 0.82
split-divider-color = #2d2842
custom-shader = 着色器/极光流光边框.glsl
custom-shader = 着色器/光标彗星拖尾.glsl
custom-shader-animation = always
