# ============================================================
# 风格：赛博彗星拖尾（Cyberdream + 光标流光拖尾 + 霓虹微辉光）
# 氛围：高对比墨黑赛博色板，打字与移动光标自带丝滑彗星拖尾和克制文字微光
# 优化点：组合使用 光标彗星拖尾.glsl + 霓虹文字辉光.glsl，开启 linear-corrected 色彩更通透
# ============================================================

background = #16181a
foreground = #ffffff
cursor-color = #5ef1ff
cursor-text = #16181a
selection-background = #2e3847
selection-foreground = #ffffff

palette = 0=#16181a
palette = 1=#ff6e5e
palette = 2=#5eff6c
palette = 3=#f1ff5e
palette = 4=#5ea1ff
palette = 5=#bd5eff
palette = 6=#5ef1ff
palette = 7=#ffffff
palette = 8=#6f7885
palette = 9=#ff8a7d
palette = 10=#7eff89
palette = 11=#f5ff85
palette = 12=#7eb5ff
palette = 13=#cf82ff
palette = 14=#85f6ff
palette = 15=#ffffff

window-colorspace = display-p3
alpha-blending = linear-corrected
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
font-thicken = true
cursor-style = block
cursor-style-blink = false
unfocused-split-opacity = 0.82
split-divider-color = #2b3038
custom-shader = 着色器/霓虹文字辉光.glsl
custom-shader = 着色器/光标彗星拖尾.glsl
custom-shader-animation = always
