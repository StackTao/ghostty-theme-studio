# ============================================================
# 风格：黑客帝国荧光绿（Matrix 翠绿磷光 + CRT 扫描线 + 彗星拖尾）
# 氛围：纯粹深邃黑底 + 经典黑客翡翠磷光绿与微弱扫描线，极客仪式感拉满
# 优化点：避免刺眼纯荧光绿 #00ff00，调校为耐看翡翠磷光 #39e58c，写代码不伤眼
# ============================================================

background = #080e0a
foreground = #78f0a8
cursor-color = #39ff8c
cursor-text = #080e0a
selection-background = #174229
selection-foreground = #d6ffe6

palette = 0=#0f1c13
palette = 1=#ff6b6b
palette = 2=#39e58c
palette = 3=#d4f26b
palette = 4=#36c9a8
palette = 5=#80e5b8
palette = 6=#4df0c8
palette = 7=#a8f5c4
palette = 8=#3d6e4f
palette = 9=#ff8c8c
palette = 10=#6bffae
palette = 11=#e6ff8a
palette = 12=#5de0c2
palette = 13=#a6f2d0
palette = 14=#7df7d8
palette = 15=#e0ffec

window-colorspace = display-p3
alpha-blending = linear-corrected
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
font-thicken = true
cursor-style = block
cursor-style-blink = true
unfocused-split-opacity = 0.85
split-divider-color = #173321
custom-shader = 着色器/复古CRT荧幕.glsl
custom-shader = 着色器/光标彗星拖尾.glsl
custom-shader-animation = always
