# ============================================================
# 风格：复古琥珀CRT（暖琥珀磷光终端 + 复古扫描线着色器）
# 氛围：致敬 80 年代高端琥珀色磷光 CRT 显示器，温润护眼且充满复古科幻氛围
# 优化点：使用无眩晕曲面的 复古CRT荧幕.glsl，微扫描线 + 柔暗角 + 磷光溢出
# ============================================================

background = #14100a
foreground = #ffb84d
cursor-color = #ffd27d
cursor-text = #14100a
selection-background = #4d3514
selection-foreground = #ffe8b8

palette = 0=#1f180e
palette = 1=#e86a38
palette = 2=#d9a84e
palette = 3=#ffb84d
palette = 4=#c9893b
palette = 5=#e67e51
palette = 6=#e8b86d
palette = 7=#f2c879
palette = 8=#7d5c32
palette = 9=#ff8552
palette = 10=#f0c167
palette = 11=#ffd07a
palette = 12=#e0a052
palette = 13=#f59b73
palette = 14=#f7cf8d
palette = 15=#fff0cc

window-colorspace = display-p3
alpha-blending = linear-corrected
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
font-thicken = true
cursor-style = block
cursor-style-blink = true
unfocused-split-opacity = 0.86
split-divider-color = #362814
custom-shader = 着色器/复古CRT荧幕.glsl
custom-shader = 着色器/光标彗星拖尾.glsl
custom-shader-animation = always
