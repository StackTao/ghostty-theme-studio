# ============================================================
# 风格：落日绯红辉光（Horizon 落日晚霞 + 霓虹微辉光 + 彗星拖尾）
# 氛围：电影感暖绯红晚霞、珊瑚橘与翠绿青，搭配细腻霓虹微光与流星光标
# 优化点：优化 Horizon 暗淡光标为明艳落日红 #e95678，并提升暗灰注释亮度
# ============================================================

background = #1c1e26
foreground = #e5e7eb
cursor-color = #e95678
cursor-text = #1c1e26
selection-background = #3f3649
selection-foreground = #ffffff

palette = 0=#16161c
palette = 1=#e95678
palette = 2=#29d398
palette = 3=#fab795
palette = 4=#26bbd9
palette = 5=#ee64ac
palette = 6=#59e1e3
palette = 7=#e5e5e5
palette = 8=#6c6f93
palette = 9=#f07190
palette = 10=#4be0ac
palette = 11=#fccaa8
palette = 12=#48cbe5
palette = 13=#f382be
palette = 14=#7cebed
palette = 15=#ffffff

window-colorspace = display-p3
alpha-blending = linear-corrected
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
font-thicken = true
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.84
split-divider-color = #2e303e
custom-shader = 着色器/霓虹文字辉光.glsl
custom-shader = 着色器/光标彗星拖尾.glsl
custom-shader-animation = always
