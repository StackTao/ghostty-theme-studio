# ============================================================
# 风格：翡翠极光全特效（Lumina Aurora + 磨砂 + 极光边框 + 光标拖尾）
# 氛围：深海翡翠暗夜底色 + 柔和毛玻璃 + 呼吸感极光流光边框 + 丝滑拖尾，一站式旗舰范
# 优化点：全特效拉满但严格控制发光阈值，兼具高颜值与日常编码清晰度
# ============================================================

background = #051414
foreground = #d8e6e5
cursor-color = #6cd79d
cursor-text = #051414
selection-background = #1a4236
selection-foreground = #f0faf9

palette = 0=#0a2020
palette = 1=#e0746b
palette = 2=#6cd79d
palette = 3=#ebd68a
palette = 4=#84d2db
palette = 5=#e7ade1
palette = 6=#79e0c8
palette = 7=#b6c8c7
palette = 8=#5d7e80
palette = 9=#f0968e
palette = 10=#9ef0c1
palette = 11=#ffe999
palette = 12=#a6e3eb
palette = 13=#f7c6f2
palette = 14=#a2f2df
palette = 15=#e6f5f4

background-opacity = 0.88
background-blur = 24
window-colorspace = display-p3
alpha-blending = linear-corrected
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
font-thicken = true
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.84
split-divider-color = #143330
custom-shader = 着色器/极光流光边框.glsl
custom-shader = 着色器/光标彗星拖尾.glsl
custom-shader-animation = always
