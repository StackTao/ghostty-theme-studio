# ============================================================
# 风格：京都竹林微雨（背景图氛围版）
# 氛围：暮色薄雾竹影隐现于右侧，搭配低饱和度森系常青配色，宁静禅意
# 视觉优化：
#   1. 定制暗雾竹林壁纸，中部与左侧保持柔和深松绿，代码专注度极高
#   2. 柔和米白字体与琥珀光标，宛如在京都茶室写代码
# ============================================================

background = #1a221e
foreground = #d8ccb2
cursor-color = #e69875
cursor-text = #1a221e
selection-background = #394b40
selection-foreground = #f0e8d5

# 背景图设置
background-image = 背景图/京都竹林微雨.png
background-image-fit = cover
background-image-position = center
background-image-opacity = 0.45
background-image-repeat = false

# ANSI 标准 0-7
palette = 0=#28332d
palette = 1=#e67e80
palette = 2=#a7c080
palette = 3=#dbbc7f
palette = 4=#7fbbb3
palette = 5=#d699b6
palette = 6=#83c092
palette = 7=#d3c6aa

# ANSI 亮色 8-15
palette = 8=#79877b
palette = 9=#f29496
palette = 10=#bfd69c
palette = 11=#edd39f
palette = 12=#9ad1ca
palette = 13=#e5b3cb
palette = 14=#9fd6ac
palette = 15=#f0e8d5

# 质感与细节优化
background-opacity = 0.97
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 16
window-padding-y = 14
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.2
cursor-style = block
cursor-style-blink = false
unfocused-split-opacity = 0.85
split-divider-color = #2f3d35
