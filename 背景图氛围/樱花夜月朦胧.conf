# ============================================================
# 风格：樱花夜月朦胧（背景图氛围版）
# 氛围：暗梅夜空、弯月轻悬与右侧飘零樱瓣，温柔浪漫的 Rosé Pine 诗意
# 视觉优化：
#   1. 定制夜樱残月壁纸，所有元素克制收敛于右上区域，不影响终端主视野
#   2. 玫瑰金光标与柔紫选区，氛围统一细腻
# ============================================================

background = #171522
foreground = #e4e1f6
cursor-color = #ebbcba
cursor-text = #171522
selection-background = #3c3657
selection-foreground = #f5f3ff

# 背景图设置
background-image = 背景图/樱花夜月朦胧.png
background-image-fit = cover
background-image-position = center
background-image-opacity = 0.45
background-image-repeat = false

# ANSI 标准 0-7
palette = 0=#26233a
palette = 1=#eb6f92
palette = 2=#3e8fb0
palette = 3=#f6c177
palette = 4=#9ccfd8
palette = 5=#c4a7e7
palette = 6=#ebbcba
palette = 7=#d8d5eb

# ANSI 亮色 8-15
palette = 8=#7e7999
palette = 9=#f58aa8
palette = 10=#58a9ca
palette = 11=#fad49b
palette = 12=#b5e2ea
palette = 13=#d7c0f4
palette = 14=#f5d1cf
palette = 15=#f5f3ff

# 质感与细节优化
background-opacity = 0.96
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 16
window-padding-y = 14
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.2
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.83
split-divider-color = #2c2842
