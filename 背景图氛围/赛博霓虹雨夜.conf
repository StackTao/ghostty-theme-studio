# ============================================================
# 风格：赛博霓虹雨夜（背景图氛围版）
# 氛围：深夜雨窗霓虹散景 + 电光青/品红语法，电影感拉满且正文极清晰
# 视觉优化：
#   1. 专属定制暗调雨夜散景壁纸，顶部与中部大面积深邃暗区不干扰代码
#   2. background-image-opacity = 0.28 + minimum-contrast = 1.25 保证文字锐利
#   3. 搭配微微透明磨砂与 display-p3 广色域
# ============================================================

background = #0d101b
foreground = #e2e8f8
cursor-color = #38bdf8
cursor-text = #0d101b
selection-background = #2c3e6b
selection-foreground = #ffffff

# 背景图设置
background-image = 背景图/赛博霓虹雨夜.png
background-image-fit = cover
background-image-position = center
background-image-opacity = 0.28
background-image-repeat = false

# ANSI 标准 0-7
palette = 0=#181d2f
palette = 1=#fb5b7c
palette = 2=#5eead4
palette = 3=#fcd34d
palette = 4=#60a5fa
palette = 5=#f472b6
palette = 6=#38bdf8
palette = 7=#cbd5e1

# ANSI 亮色 8-15
palette = 8=#6f7c9e
palette = 9=#ff7a96
palette = 10=#86f7e6
palette = 11=#fde68a
palette = 12=#93c5fd
palette = 13=#f9a8d4
palette = 14=#7dd3fc
palette = 15=#f8fafc

# 质感与细节优化
background-opacity = 0.96
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 16
window-padding-y = 14
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.25
font-thicken = true
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.82
split-divider-color = #232a42
