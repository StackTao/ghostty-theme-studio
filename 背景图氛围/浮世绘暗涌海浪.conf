# ============================================================
# 风格：浮世绘暗涌海浪（背景图氛围版）
# 氛围：极简暗金浮世绘浪花轻栖右下角，左上大面积静谧深靛蓝，极度雅致
# 视觉优化：
#   1. 专属定制极简哑光浮世绘壁纸，与 Kanagawa 暖金色板浑然天成
#   2. 背景图不透明度 0.42 既能清晰欣赏金线浪花，又完全不抢正文视线
# ============================================================

background = #171822
foreground = #dfd9be
cursor-color = #e6c384
cursor-text = #171822
selection-background = #2d4f67
selection-foreground = #f0ebd6

# 背景图设置
background-image = 背景图/浮世绘暗涌海浪.png
background-image-fit = cover
background-image-position = bottom-right
background-image-opacity = 0.42
background-image-repeat = false

# ANSI 标准 0-7
palette = 0=#1e202c
palette = 1=#d65d63
palette = 2=#87a978
palette = 3=#d1b277
palette = 4=#7e9cd8
palette = 5=#a08bc4
palette = 6=#73a396
palette = 7=#cdc59a

# ANSI 亮色 8-15
palette = 8=#797870
palette = 9=#eb7a86
palette = 10=#a6c97c
palette = 11=#ebd096
palette = 12=#8ec0d6
palette = 13=#b6a5d9
palette = 14=#8bbab0
palette = 15=#f2edd6

# 质感与细节优化
background-opacity = 0.97
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 16
window-padding-y = 14
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.2
cursor-style = block
cursor-style-blink = false
unfocused-split-opacity = 0.84
split-divider-color = #2b2d3d
