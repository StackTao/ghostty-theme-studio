# ============================================================
# 风格：星际深空星云（背景图氛围版）
# 氛围：深邃黑曜石宇宙 + 右下角微醺琥珀星尘，极客高级感拉满
# 视觉优化：
#   1. 定制黑曜石微光星云壁纸，克制留白与极细星点，耐看度极高
#   2. 搭配修复优化后的 Vesper 琥珀金 + 薄荷青色板
# ============================================================

background = #0e0f14
foreground = #eae8e4
cursor-color = #ffc799
cursor-text = #0e0f14
selection-background = #332c24
selection-foreground = #fff8f0

# 背景图设置
background-image = 背景图/星际深空星云.png
background-image-fit = cover
background-image-position = center
background-image-opacity = 0.48
background-image-repeat = false

# ANSI 标准 0-7
palette = 0=#1c1d24
palette = 1=#f58a8a
palette = 2=#87d6bc
palette = 3=#ffc799
palette = 4=#9fa8da
palette = 5=#d8a6e0
palette = 6=#80d8ff
palette = 7=#bebcb8

# ANSI 亮色 8-15
palette = 8=#72717a
palette = 9=#ffa3a3
palette = 10=#99ffe4
palette = 11=#ffd8b5
palette = 12=#b8c0f0
palette = 13=#e8bef0
palette = 14=#a6e6ff
palette = 15=#f7f6f2

# 质感与细节优化
background-opacity = 0.97
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 16
window-padding-y = 14
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.2
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.82
split-divider-color = #252630
