# ============================================================
# 风格：极光雪夜山脉（背景图氛围版）
# 氛围：北欧静谧星夜、远山剪影与淡淡青紫极光，清冷治愈
# 视觉优化：
#   1. 定制极简极光雪山壁纸，极光柔焦居于右上，正文区域干净清透
#   2. 优化 Nord 冰青与霜白对比度，清爽高可读
# ============================================================

background = #1a1f2b
foreground = #e5e9f0
cursor-color = #88c0d0
cursor-text = #1a1f2b
selection-background = #354359
selection-foreground = #f2f5fa

# 背景图设置
background-image = 背景图/极光雪夜山脉.png
background-image-fit = cover
background-image-position = center
background-image-opacity = 0.44
background-image-repeat = false

# ANSI 标准 0-7
palette = 0=#272e3d
palette = 1=#cc6c76
palette = 2=#a3be8c
palette = 3=#ebcb8b
palette = 4=#81a1c1
palette = 5=#b48ead
palette = 6=#88c0d0
palette = 7=#d8dee9

# ANSI 亮色 8-15
palette = 8=#6e7c96
palette = 9=#de818b
palette = 10=#b9d6a1
palette = 11=#f5daa2
palette = 12=#98b9dc
palette = 13=#cca4c5
palette = 14=#9dd9e9
palette = 15=#f2f5fa

# 质感与细节优化
background-opacity = 0.96
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 16
window-padding-y = 14
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.2
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.84
split-divider-color = #2e3647
