# ============================================================
# 风格：午夜猫头鹰（Night Owl 深夜编码优化版）
# 氛围：前端圈封神的深夜海军蓝 + 冰薄荷 + 薰衣草紫 + 暖星黄，专门针对夜间低光调校
# 优化点：提亮注释灰并改用清脆青蓝光标 #7fdbca，看日志与代码极其省眼
# ============================================================

background = #011627
foreground = #d6deeb
cursor-color = #7fdbca
cursor-text = #011627
selection-background = #1d3b53
selection-foreground = #ffffff

palette = 0=#011627
palette = 1=#ef5350
palette = 2=#22da6e
palette = 3=#addb67
palette = 4=#82aaff
palette = 5=#c792ea
palette = 6=#21c7a8
palette = 7=#d6deeb
palette = 8=#637777
palette = 9=#ff7370
palette = 10=#4ee88d
palette = 11=#ffeb95
palette = 12=#9ec0ff
palette = 13=#d9b0f2
palette = 14=#7fdbca
palette = 15=#ffffff

window-colorspace = display-p3
alpha-blending = linear-corrected
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.84
split-divider-color = #122d42
