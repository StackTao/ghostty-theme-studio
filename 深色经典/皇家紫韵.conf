# ============================================================
# 风格：皇家紫韵（Shades Of Purple 柔化优化版）
# 氛围：个性十足的皇家紫夜空 + 灿金色光标 + 鲜明薄荷与洋红，极具视觉冲击力
# 优化点：修复原版选区对比不足与文字过白，柔化色温更具高级紫调质感
# ============================================================

background = #1e1d40
foreground = #edeaff
cursor-color = #fad000
cursor-text = #1e1d40
selection-background = #4d3b8a
selection-foreground = #ffffff

palette = 0=#171633
palette = 1=#ff5c7c
palette = 2=#3ad900
palette = 3=#fad000
palette = 4=#6943ff
palette = 5=#ff628c
palette = 6=#80fcff
palette = 7=#d8d4f2
palette = 8=#7e78b8
palette = 9=#ff7a94
palette = 10=#63e833
palette = 11=#ffe047
palette = 12=#9175ff
palette = 13=#ff85a6
palette = 14=#a8fdff
palette = 15=#ffffff

window-colorspace = display-p3
alpha-blending = linear-corrected
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
cursor-style = block
cursor-style-blink = true
unfocused-split-opacity = 0.84
split-divider-color = #323066
