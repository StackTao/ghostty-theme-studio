# ============================================================
# 风格：皇家钴蓝（Cobalt2 经典重构优化版）
# 氛围：极具辨识度的浓郁皇家钴蓝底 + 亮金丝雀黄光标 + 清脆青绿，告别千篇一律灰黑
# 优化点：修复原版过暗注释灰与糊光标字色，让标志性钴蓝+亮黄焕发高级感
# ============================================================

background = #152a3d
foreground = #f2f6fa
cursor-color = #ffc600
cursor-text = #152a3d
selection-background = #0b4a7d
selection-foreground = #ffffff

palette = 0=#0f2030
palette = 1=#ff628c
palette = 2=#3ad900
palette = 3=#ffc600
palette = 4=#0088ff
palette = 5=#fb94ff
palette = 6=#80fcff
palette = 7=#e1efff
palette = 8=#6887a8
palette = 9=#ff85a6
palette = 10=#63e833
palette = 11=#ffd642
palette = 12=#47abff
palette = 13=#fcb3ff
palette = 14=#a8fdff
palette = 15=#ffffff

window-colorspace = display-p3
alpha-blending = linear-corrected
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
cursor-style = block
cursor-style-blink = true
unfocused-split-opacity = 0.84
split-divider-color = #1f3d59
