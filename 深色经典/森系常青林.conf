# ============================================================
# 风格：森系常青林（Everforest Dark 优化版）
# 氛围：低饱和度森林苔绿与暖米白，自然护眼、写代码一整天不累
# 优化点：
#   1. 修复内置版亮色组 (9-14) 饱和度突然暴增刺眼的瑕疵，统一柔和森系色温
#   2. 修复内置版暗紫红选区与整体绿调不协调问题，改用温润深松绿选区 #3f4d45
#   3. 光标改为温和落日橘 #e69875，醒目又自然
# ============================================================

background = #272e33
foreground = #d3c6aa
cursor-color = #e69875
cursor-text = #272e33
selection-background = #3f4d45
selection-foreground = #ece3cf

# ANSI 标准 0-7
palette = 0=#374145
palette = 1=#e67e80
palette = 2=#a7c080
palette = 3=#dbbc7f
palette = 4=#7fbbb3
palette = 5=#d699b6
palette = 6=#83c092
palette = 7=#d3c6aa

# ANSI 亮色 8-15
palette = 8=#7a8478
palette = 9=#f09496
palette = 10=#bdd49a
palette = 11=#ebd19b
palette = 12=#99cfc8
palette = 13=#e3b2c9
palette = 14=#9dd4aa
palette = 15=#ece3cf

# 质感与细节优化
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.1
cursor-style = block
cursor-style-blink = false
unfocused-split-opacity = 0.85
split-divider-color = #374145
