# ============================================================
# 风格：碳黑霓虹（Oxocarbon 修复优化版）
# 氛围：源自 IBM Carbon 设计语言，极致纯黑碳灰底 + 赛博洋红/天青/翡翠，现代极简
# 优化点：彻底修复原版选中文字几乎看不清（灰字灰底）的严重缺陷，理顺标准 ANSI 色位
# ============================================================

background = #161616
foreground = #f2f4f8
cursor-color = #ff7eb6
cursor-text = #161616
selection-background = #393939
selection-foreground = #ffffff

palette = 0=#262626
palette = 1=#ee5396
palette = 2=#42be65
palette = 3=#ffe97b
palette = 4=#33b1ff
palette = 5=#be95ff
palette = 6=#08bdba
palette = 7=#dde1e6
palette = 8=#6f6f6f
palette = 9=#ff7eb6
palette = 10=#6fdc8c
palette = 11=#fff1a8
palette = 12=#78a9ff
palette = 13=#d4bbff
palette = 14=#3ddbd9
palette = 15=#ffffff

window-colorspace = display-p3
alpha-blending = linear-corrected
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.84
split-divider-color = #2c2c2c
