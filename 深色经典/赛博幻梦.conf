# ============================================================
# 风格：赛博幻梦（Cyberdream 高对比极客版）
# 氛围：干净纯粹的深炭黑底 + 锐利电光青/珊瑚红/薄荷绿，极度清晰且极具现代感
# 优化点：Neovim/Ghostty 社区爆火的高对比极简未来风
# ============================================================

background = #16181a
foreground = #ffffff
cursor-color = #5ef1ff
cursor-text = #16181a
selection-background = #2e3847
selection-foreground = #ffffff

palette = 0=#16181a
palette = 1=#ff6e5e
palette = 2=#5eff6c
palette = 3=#f1ff5e
palette = 4=#5ea1ff
palette = 5=#bd5eff
palette = 6=#5ef1ff
palette = 7=#ffffff
palette = 8=#7b8496
palette = 9=#ff8c7e
palette = 10=#82ff8d
palette = 11=#f5ff85
palette = 12=#82b7ff
palette = 13=#cf82ff
palette = 14=#85f6ff
palette = 15=#ffffff

window-colorspace = display-p3
alpha-blending = linear-corrected
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
cursor-style = block
cursor-style-blink = false
unfocused-split-opacity = 0.82
split-divider-color = #2b3038
