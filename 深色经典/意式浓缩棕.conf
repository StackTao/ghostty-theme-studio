# ============================================================
# 风格：意式浓缩棕（Monokai Pro Ristretto 优化版）
# 氛围：温暖浓郁的深度烘焙咖啡褐底 + 玫瑰莓红 + 奶油焦糖黄 + 淡薰衣草，复古又精致
# 优化点：适合喜欢暖调暗色、觉得冷蓝色太冰冷的审美偏好
# ============================================================

background = #2c2525
foreground = #fff1f3
cursor-color = #f9cc6c
cursor-text = #2c2525
selection-background = #524646
selection-foreground = #ffffff

palette = 0=#2c2525
palette = 1=#fd6883
palette = 2=#adda78
palette = 3=#f9cc6c
palette = 4=#f38d70
palette = 5=#a8a9eb
palette = 6=#85dacc
palette = 7=#fff1f3
palette = 8=#85797a
palette = 9=#ff879d
palette = 10=#bfe394
palette = 11=#fbd98e
palette = 12=#f7a68f
palette = 13=#bfc0f2
palette = 14=#a3e6db
palette = 15=#ffffff

window-colorspace = display-p3
alpha-blending = linear-corrected
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
cursor-style = block
cursor-style-blink = false
unfocused-split-opacity = 0.85
split-divider-color = #423838
