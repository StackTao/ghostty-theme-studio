# ============================================================
# 风格：静谧深海（Poimandres 优化版）
# 氛围：极简暗夜青灰 + 发光薄荷青 + 冰天蓝 + 温柔浅粉，设计师最爱的冷静克制风
# 优化点：修复原版选区白字灰底看不清的问题，正文微提亮至 #c5cce6 更利落
# ============================================================

background = #1b1e28
foreground = #c5cce6
cursor-color = #5de4c7
cursor-text = #1b1e28
selection-background = #30384f
selection-foreground = #ffffff

palette = 0=#1b1e28
palette = 1=#d0679d
palette = 2=#5de4c7
palette = 3=#fffac2
palette = 4=#89ddff
palette = 5=#fcc5e9
palette = 6=#add7ff
palette = 7=#e4f0fb
palette = 8=#767c9d
palette = 9=#e381b3
palette = 10=#80f0d8
palette = 11=#fffcd4
palette = 12=#a8e6ff
palette = 13=#fde0f3
palette = 14=#c9e5ff
palette = 15=#ffffff

window-colorspace = display-p3
alpha-blending = linear-corrected
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.84
split-divider-color = #2b3042
