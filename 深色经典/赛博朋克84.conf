# ============================================================
# 风格：赛博朋克84（Synthwave '84 护眼优化版）
# 氛围：80年代复古未来主义，霓虹品红、电光青与落日金的律动碰撞
# 优化点：
#   1. 原版紫底偏亮易视觉疲劳，优化压深至静谧午夜紫黑 #1b1629
#   2. 柔和正文色彩并精选高辨识度霓虹品红光标 #ff4ecd，酷炫且真能日常写代码
# ============================================================

background = #1b1629
foreground = #ece4ff
cursor-color = #ff4ecd
cursor-text = #1b1629
selection-background = #412d66
selection-foreground = #ffffff

# ANSI 标准 0-7
palette = 0=#27203a
palette = 1=#fe4450
palette = 2=#72f1b8
palette = 3=#fede5d
palette = 4=#36f9f6
palette = 5=#ff7edb
palette = 6=#46d9ff
palette = 7=#d8cef0

# ANSI 亮色 8-15
palette = 8=#796b9c
palette = 9=#ff6e78
palette = 10=#96f7cb
palette = 11=#ffea85
palette = 12=#6efbf9
palette = 13=#ff9ee5
palette = 14=#7de4ff
palette = 15=#ffffff

# 质感与细节优化
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.80
split-divider-color = #342952
