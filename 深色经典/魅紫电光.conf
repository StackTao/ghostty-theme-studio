# ============================================================
# 风格：魅紫电光（Aura 优化版）
# 氛围：丝绒深紫黑 + 荧光薄荷绿 + 电光紫 + 暖蜜桃橙，极度吸睛的现代暗紫美学
# 优化点：修复原版过艳紫选区与过暗注释，区分普通与亮色组层次
# ============================================================

background = #15141b
foreground = #edecee
cursor-color = #a277ff
cursor-text = #15141b
selection-background = #362b59
selection-foreground = #ffffff

palette = 0=#110f18
palette = 1=#ff6767
palette = 2=#61ffca
palette = 3=#ffca85
palette = 4=#a277ff
palette = 5=#f694ff
palette = 6=#61ffca
palette = 7=#edecee
palette = 8=#6d6d6d
palette = 9=#ff8585
palette = 10=#85ffd6
palette = 11=#ffd8a3
palette = 12=#bc9bff
palette = 13=#fab5ff
palette = 14=#8afce0
palette = 15=#ffffff

window-colorspace = display-p3
alpha-blending = linear-corrected
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.83
split-divider-color = #2b273d
