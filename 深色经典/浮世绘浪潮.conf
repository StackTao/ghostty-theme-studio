# ============================================================
# 风格：浮世绘浪潮（Kanagawa Wave 优化版）
# 氛围：灵感源自《神奈川冲浪里》，深靛炭黑与温润和纸金，极耐看
# 优化点：
#   1. 修复内置版米白反白选区过刺眼的问题，改用经典深海浪蓝 #2d4f67
#   2. 微调背景至更沉稳的 #1b1b24，增强暖金/竹绿语法对比度
#   3. 光标选用柔和秋金色 #e6c384，复古文艺感拉满
# ============================================================

background = #1b1b24
foreground = #dcd7ba
cursor-color = #e6c384
cursor-text = #1b1b24
selection-background = #2d4f67
selection-foreground = #e6e0c2

# ANSI 标准 0-7
palette = 0=#16161d
palette = 1=#c34043
palette = 2=#76946a
palette = 3=#c0a36e
palette = 4=#7e9cd8
palette = 5=#957fb8
palette = 6=#6a9589
palette = 7=#c8c093

# ANSI 亮色 8-15
palette = 8=#76756d
palette = 9=#e46876
palette = 10=#98bb6c
palette = 11=#e6c384
palette = 12=#7fb4ca
palette = 13=#a899c9
palette = 14=#7aa89f
palette = 15=#ebe6cc

# 质感与细节优化
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.1
cursor-style = block
cursor-style-blink = false
unfocused-split-opacity = 0.84
split-divider-color = #2a2a37
