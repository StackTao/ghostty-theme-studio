# ============================================================
# 风格：暗黑伯爵（Dracula+ 高对比优化版）
# 氛围：经典暗黑紫黑 + 亮翡翠绿 + 霓虹桃粉 + 冰青，鲜明活泼、辨识度拉满
# 优化点：彻底修复内置 Dracula+ 纯白反白选区刺眼问题，改为高级暗紫选区 #44475a
# ============================================================

background = #21222c
foreground = #f8f8f2
cursor-color = #ff79c6
cursor-text = #21222c
selection-background = #44475a
selection-foreground = #ffffff

palette = 0=#21222c
palette = 1=#ff5555
palette = 2=#50fa7b
palette = 3=#f1fa8c
palette = 4=#bd93f9
palette = 5=#ff79c6
palette = 6=#8be9fd
palette = 7=#f8f8f2
palette = 8=#727796
palette = 9=#ff6e6e
palette = 10=#69ff94
palette = 11=#ffffa5
palette = 12=#d6acff
palette = 13=#ff92df
palette = 14=#a4ffff
palette = 15=#ffffff

window-colorspace = display-p3
alpha-blending = linear-corrected
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.84
split-divider-color = #343746
