# ============================================================
# 风格：克苏鲁秘境（Eldritch 暗黑幻想优化版）
# 氛围：深渊幽紫黑 + 荧光魔力翡翠 + 电光青蓝 + 神秘金黄，辨识度极高的奇幻深色系
# 优化点：精心调校荧光绿与深紫底对比度，酷炫同时保证长时阅读舒适
# ============================================================

background = #171928
foreground = #ebfafa
cursor-color = #37f499
cursor-text = #171928
selection-background = #323449
selection-foreground = #ffffff

palette = 0=#212337
palette = 1=#f16c75
palette = 2=#37f499
palette = 3=#f1fc79
palette = 4=#04d1f9
palette = 5=#a48cf2
palette = 6=#04d1f9
palette = 7=#ebfafa
palette = 8=#7081d0
palette = 9=#f58a91
palette = 10=#69f7b2
palette = 11=#f6fd9e
palette = 12=#4ce0fc
palette = 13=#bfaaff
palette = 14=#5ee8ff
palette = 15=#ffffff

window-colorspace = display-p3
alpha-blending = linear-corrected
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
cursor-style = block
cursor-style-blink = true
unfocused-split-opacity = 0.82
split-divider-color = #2c2f4a
