# ============================================================
# 风格：复古暖棕胶片（Gruvbox Material Dark 优化版）
# 氛围：温暖咖啡炭棕、焦糖琥珀与复古橄榄绿，老派硬核又不失柔和
# 优化点：
#   1. 采用 Gruvbox Material 柔化色板，避免老版 Gruvbox 过分刺眼的荧光黄绿
#   2. 调校选区与注释对比度，兼顾复古韵味与现代清晰度
# ============================================================

background = #22201f
foreground = #dfd3bc
cursor-color = #e78a4e
cursor-text = #22201f
selection-background = #443d38
selection-foreground = #f2e8d5

# ANSI 标准 0-7
palette = 0=#32302f
palette = 1=#ea6962
palette = 2=#a9b665
palette = 3=#d8a657
palette = 4=#7daea3
palette = 5=#d3869b
palette = 6=#89b482
palette = 7=#d4be98

# ANSI 亮色 8-15
palette = 8=#82776b
palette = 9=#f2857f
palette = 10=#bcc97d
palette = 11=#e8bc72
palette = 12=#94c4b9
palette = 13=#e29fb2
palette = 14=#a2c99b
palette = 15=#f2e8d5

# 质感与细节优化
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.1
cursor-style = block
cursor-style-blink = false
unfocused-split-opacity = 0.84
split-divider-color = #3c3836
