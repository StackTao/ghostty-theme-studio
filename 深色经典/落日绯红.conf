# ============================================================
# 风格：落日绯红（Horizon 优化版）
# 氛围：日落时分的深酒炭底色，搭配绯红、蜜桃橘、清脆青绿，极具电影温暖层次
# 优化点：修复原版暗紫灰光标辨识度低的问题，换为明快落日红 #e95678
# ============================================================

background = #1c1e26
foreground = #e1e3e8
cursor-color = #e95678
cursor-text = #1c1e26
selection-background = #3d3447
selection-foreground = #ffffff

palette = 0=#16161c
palette = 1=#e95678
palette = 2=#29d398
palette = 3=#fab795
palette = 4=#26bbd9
palette = 5=#ee64ac
palette = 6=#59e1e3
palette = 7=#d5d8da
palette = 8=#6c6f93
palette = 9=#f07190
palette = 10=#48e0aa
palette = 11=#fcc7ab
palette = 12=#48c9e3
palette = 13=#f382be
palette = 14=#7cebed
palette = 15=#ffffff

window-colorspace = display-p3
alpha-blending = linear-corrected
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.84
split-divider-color = #2e303e
