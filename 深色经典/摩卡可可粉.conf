# ============================================================
# 风格：摩卡可可粉（Catppuccin Mocha 优化版）
# 氛围：丝绒深紫灰搭配马卡龙粉彩，温和护眼、社区人气王
# 优化点：
#   1. 修复内置版选区过亮刺眼的问题（改为柔和紫灰 #45475a 选区）
#   2. 提亮注释/补全灰 palette 8 (#585b70 -> #737790)，阅读更省力
#   3. 光标改为暖玫瑰金 #f5e0dc，清爽不喧宾夺主
# ============================================================

background = #1e1e2e
foreground = #cdd6f4
cursor-color = #f5e0dc
cursor-text = #1e1e2e
selection-background = #45475a
selection-foreground = #eff3ff

# ANSI 标准 0-7
palette = 0=#45475a
palette = 1=#f38ba8
palette = 2=#a6e3a1
palette = 3=#f9e2af
palette = 4=#89b4fa
palette = 5=#f5c2e7
palette = 6=#94e2d5
palette = 7=#bac2de

# ANSI 亮色 8-15
palette = 8=#737790
palette = 9=#f8a3ba
palette = 10=#bdf0b9
palette = 11=#fdecc4
palette = 12=#a6c6fc
palette = 13=#f7d3ee
palette = 14=#b0ece2
palette = 15=#dce3fa

# 质感与细节优化
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.1
cursor-style = block
cursor-style-blink = true
unfocused-split-opacity = 0.84
split-divider-color = #313244
