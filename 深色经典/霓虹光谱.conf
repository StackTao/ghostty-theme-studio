# ============================================================
# 风格：霓虹光谱（Monokai Pro Spectrum 优化版）
# 氛围：经典付费设计主题风格：高级中性炭灰底 + 精准饱和度光谱七色，怎么看都专业
# 优化点：修复原版光标对比不足，提升整体字色锐度与分屏边界质感
# ============================================================

background = #222222
foreground = #f7f1ff
cursor-color = #fce566
cursor-text = #222222
selection-background = #47454a
selection-foreground = #ffffff

palette = 0=#222222
palette = 1=#fc618d
palette = 2=#7bd88f
palette = 3=#fce566
palette = 4=#fd9353
palette = 5=#948ae3
palette = 6=#5ad4e6
palette = 7=#f7f1ff
palette = 8=#7c7a80
palette = 9=#ff7ea3
palette = 10=#96e3a7
palette = 11=#fded8a
palette = 12=#ffa975
palette = 13=#aca3ed
palette = 14=#7ee0ef
palette = 15=#ffffff

window-colorspace = display-p3
alpha-blending = linear-corrected
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
cursor-style = block
cursor-style-blink = false
unfocused-split-opacity = 0.85
split-divider-color = #38363b
