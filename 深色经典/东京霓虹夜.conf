# ============================================================
# 风格：东京霓虹夜（TokyoNight 优化版）
# 氛围：深夜都市电光蓝紫，冷静克制、代码层次极佳
# 优化点：
#   1. 提亮注释/自动补全色 palette 8 (#414868 -> #626c9a)，解决 zsh 补全看不清
#   2. 调整选区与分屏分割线为和谐深靛蓝，增强多窗格层次
#   3. 开启 display-p3 广色域与透明标题栏，原生融入 macOS
# ============================================================

background = #1a1b26
foreground = #c8d3f5
cursor-color = #7aa2f7
cursor-text = #1a1b26
selection-background = #2e3c64
selection-foreground = #e0e8ff

# ANSI 标准 0-7
palette = 0=#15161e
palette = 1=#f7768e
palette = 2=#9ece6a
palette = 3=#e0af68
palette = 4=#7aa2f7
palette = 5=#bb9af7
palette = 6=#7dcfff
palette = 7=#a9b1d6

# ANSI 亮色 8-15
palette = 8=#626c9a
palette = 9=#ff899d
palette = 10=#b1e37d
palette = 11=#f0c27d
palette = 12=#8db6ff
palette = 13=#ccaaff
palette = 14=#96dcff
palette = 15=#d5defa

# 质感与细节优化
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.1
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.82
split-divider-color = #292e42
