# ============================================================
# 风格：黑曜石微光（Vesper 深度修复优化版）
# 氛围：极客黑曜石底色 + 暖琥珀金 + 薄荷冰青，高级极简质感
# 优化点：
#   1. 彻底修复内置版「灰光标+白字」看不清的缺陷，改为暖琥珀光标 #ffc799 + 深黑字
#   2. 彻底修复内置版泥泞黄褐选区，改为高级暖炭选区 #2f2a24
#   3. 将刺眼的纯白正文 #ffffff 柔化为暖雪白 #e8e6e3，OLED 屏看久不眩光
# ============================================================

background = #101012
foreground = #e8e6e3
cursor-color = #ffc799
cursor-text = #101012
selection-background = #322c25
selection-foreground = #fff7ed

# ANSI 标准 0-7
palette = 0=#1c1c20
palette = 1=#f58a8a
palette = 2=#87d6bc
palette = 3=#ffc799
palette = 4=#9fa8da
palette = 5=#d8a6e0
palette = 6=#80d8ff
palette = 7=#b8b6b2

# ANSI 亮色 8-15
palette = 8=#6e6d73
palette = 9=#ff9e9e
palette = 10=#99ffe4
palette = 11=#ffd8b5
palette = 12=#b8c0f0
palette = 13=#e8bef0
palette = 14=#a6e6ff
palette = 15=#f5f4f0

# 质感与细节优化
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 16
window-padding-y = 14
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.82
split-divider-color = #242429
