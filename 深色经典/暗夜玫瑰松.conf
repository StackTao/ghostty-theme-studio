# ============================================================
# 风格：暗夜玫瑰松（Rosé Pine 优化版）
# 氛围：极简高级暗梅紫、枯玫瑰粉与松青，优雅且极度舒适
# 优化点：
#   1. 区分 ANSI 0-7 与 8-15 亮度层次（原版两组完全相同，优化后高亮更立体）
#   2. 选用经典枯玫瑰粉 #ebbcba 作为光标，辨识度极佳
#   3. 适度提亮注释灰 palette 8，长时间读日志不费眼
# ============================================================

background = #191724
foreground = #e0def4
cursor-color = #ebbcba
cursor-text = #191724
selection-background = #393552
selection-foreground = #f0eefc

# ANSI 标准 0-7
palette = 0=#26233a
palette = 1=#eb6f92
palette = 2=#3e8fb0
palette = 3=#f6c177
palette = 4=#9ccfd8
palette = 5=#c4a7e7
palette = 6=#ebbcba
palette = 7=#d8d5eb

# ANSI 亮色 8-15
palette = 8=#7b7696
palette = 9=#f489a7
palette = 10=#56a6c7
palette = 11=#fad298
palette = 12=#b3dfe7
palette = 13=#d6bef2
palette = 14=#f4cfcd
palette = 15=#f0eefc

# 质感与细节优化
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.1
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.83
split-divider-color = #2a273f
