# ============================================================
# 风格：魅紫液态玻璃（Aura + macOS 原生 Liquid Glass）
# 氛围：暗紫电光色板融入 macOS 26+ 原生液态玻璃引擎，通透梦幻又自带高对比
# 优化点：macos-glass-regular + display-p3 + linear-corrected，桌面壁纸隐约透光
# ============================================================

background = #15141b
foreground = #f2f1f5
cursor-color = #a277ff
cursor-text = #15141b
selection-background = #3d3066
selection-foreground = #ffffff

palette = 0=#1b1826
palette = 1=#ff6767
palette = 2=#61ffca
palette = 3=#ffca85
palette = 4=#a277ff
palette = 5=#f694ff
palette = 6=#61ffca
palette = 7=#edecee
palette = 8=#857f99
palette = 9=#ff8787
palette = 10=#87ffd8
palette = 11=#ffd9a6
palette = 12=#be9eff
palette = 13=#fbb8ff
palette = 14=#8ffce2
palette = 15=#ffffff

background-opacity = 0.74
background-blur = macos-glass-regular
window-colorspace = display-p3
alpha-blending = linear-corrected
macos-titlebar-style = transparent
window-padding-x = 16
window-padding-y = 14
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.25
font-thicken = true
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.84
split-divider-color = #342d4d
