# ============================================================
# 风格：极光雾面毛玻璃（Nordic Aurora 雾面玻璃版）
# 氛围：北欧冰川冷灰蓝 + 冰霜青绿极光，冷静克制、高级磨砂感
# 优化点：
#   1. 解决经典 Nord 偏灰、对比度偏软的问题，加深底色至 #222732 并提亮冰蓝青
#   2. 配合 0.84 不透明度与 24 级柔和磨砂，雾面质感十足
# ============================================================

background = #222732
foreground = #e5e9f0
cursor-color = #88c0d0
cursor-text = #222732
selection-background = #3b465c
selection-foreground = #eceff4

# ANSI 标准 0-7
palette = 0=#2e3440
palette = 1=#bf616a
palette = 2=#a3be8c
palette = 3=#ebcb8b
palette = 4=#81a1c1
palette = 5=#b48ead
palette = 6=#88c0d0
palette = 7=#d8dee9

# ANSI 亮色 8-15
palette = 8=#6b7891
palette = 9=#d67680
palette = 10=#b8d4a1
palette = 11=#f5daa2
palette = 12=#96b8db
palette = 13=#cca4c5
palette = 14=#9ad6e6
palette = 15=#eceff4

# 雾面毛玻璃参数
background-opacity = 0.84
background-blur = 24
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 16
window-padding-y = 14
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.2
font-thicken = true
cursor-style = block
cursor-style-blink = false
unfocused-split-opacity = 0.84
split-divider-color = #3b4252
