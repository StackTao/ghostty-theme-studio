# ============================================================
# 风格：苹果液态玻璃深色（macOS 26+ 原生 Liquid Glass）
# 氛围：调用 macOS 原生液态玻璃引擎 + Apple 色彩体系，宛如系统内置旗舰终端
# 特性：
#   1. 使用 Ghostty 1.4+ 专属 `background-blur = macos-glass-regular`
#   2. 配合 display-p3 与苹果深空灰半透明，任何桌面壁纸上都晶莹高级
#   3. 内置 minimum-contrast 防透底看不清，实用与颜值兼得
# ============================================================

background = #16171b
foreground = #f2f3f7
cursor-color = #5ea3ff
cursor-text = #16171b
selection-background = #1c4c82
selection-foreground = #ffffff

# ANSI 标准 0-7（苹果系统色 P3 优化）
palette = 0=#2c2c2e
palette = 1=#ff6961
palette = 2=#32d74b
palette = 3=#ffd60a
palette = 4=#5ea3ff
palette = 5=#cf82ff
palette = 6=#64d2ff
palette = 7=#d1d1d6

# ANSI 亮色 8-15
palette = 8=#8e8e93
palette = 9=#ff8a82
palette = 10=#5ce670
palette = 11=#ffe359
palette = 12=#8ec0ff
palette = 13=#e0aaff
palette = 14=#9be2ff
palette = 15=#ffffff

# 液态玻璃核心参数
background-opacity = 0.72
background-blur = macos-glass-regular
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 16
window-padding-y = 14
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.25
font-thicken = true
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.82
split-divider-color = #3a3a40
