# ============================================================
# 风格：苹果液态玻璃通透（macOS 26+ Clear Liquid Glass）
# 氛围：极致晶莹通透的 macOS Clear Glass 质感，适合搭配深色质感桌面壁纸
# 特性：
#   1. 使用 `background-blur = macos-glass-clear` 呈现高通透玻璃折射感
#   2. 开启 font-thicken 与更高对比度高亮色，保证极透状态下文字依然锐利
# ============================================================

background = #111318
foreground = #f5f7fc
cursor-color = #76d6ff
cursor-text = #111318
selection-background = #25578f
selection-foreground = #ffffff

# ANSI 标准 0-7
palette = 0=#262933
palette = 1=#ff736a
palette = 2=#48e06c
palette = 3=#ffdf4d
palette = 4=#6eb2ff
palette = 5=#db94ff
palette = 6=#76e0ff
palette = 7=#dde2ed

# ANSI 亮色 8-15
palette = 8=#98a0b3
palette = 9=#ff9b94
palette = 10=#7bf095
palette = 11=#ffeb85
palette = 12=#9ecbff
palette = 13=#eabaff
palette = 14=#a6ecff
palette = 15=#ffffff

# 极透液态玻璃核心参数
background-opacity = 0.56
background-blur = macos-glass-clear
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 16
window-padding-y = 14
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.4
font-thicken = true
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.85
split-divider-color = #444a59
