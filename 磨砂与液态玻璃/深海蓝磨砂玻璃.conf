# ============================================================
# 风格：深海蓝磨砂玻璃（TokyoNight Moon 经典高斯磨砂）
# 氛围：柔和深海蓝毛玻璃质感，细腻虚化桌面背景，既梦幻又专注
# 优化点：
#   1. 黄金配比 background-opacity = 0.82 + background-blur = 28
#   2. 搭配 TokyoNight Moon 柔润蓝紫色板，比纯黑更显通透
# ============================================================

background = #1d2030
foreground = #c8d3f5
cursor-color = #82aaff
cursor-text = #1d2030
selection-background = #2f3e6e
selection-foreground = #e8eeff

# ANSI 标准 0-7
palette = 0=#1b1d2b
palette = 1=#ff757f
palette = 2=#c3e88d
palette = 3=#ffc777
palette = 4=#82aaff
palette = 5=#c099ff
palette = 6=#86e1fc
palette = 7=#b4c0e8

# ANSI 亮色 8-15
palette = 8=#6c76a3
palette = 9=#ff949c
palette = 10=#d4f2a7
palette = 11=#ffd79c
palette = 12=#a1c0ff
palette = 13=#d2b5ff
palette = 14=#a8ebff
palette = 15=#e2e9ff

# 磨砂玻璃参数
background-opacity = 0.82
background-blur = 28
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 16
window-padding-y = 14
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.2
font-thicken = true
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.82
split-divider-color = #343b58
