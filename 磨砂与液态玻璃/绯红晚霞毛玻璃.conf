# ============================================================
# 风格：绯红晚霞毛玻璃（Horizon 暖调高斯磨砂）
# 氛围：暖酒炭色半透毛玻璃搭配珊瑚绯红与薄荷青，温柔通透、氛围感绝佳
# 优化点：background-opacity = 0.80 + background-blur = 28 + font-thicken
# ============================================================

background = #1c1e26
foreground = #ebedf0
cursor-color = #e95678
cursor-text = #1c1e26
selection-background = #42364d
selection-foreground = #ffffff

palette = 0=#181921
palette = 1=#e95678
palette = 2=#29d398
palette = 3=#fab795
palette = 4=#26bbd9
palette = 5=#ee64ac
palette = 6=#59e1e3
palette = 7=#e5e5e5
palette = 8=#7a7e9e
palette = 9=#f27492
palette = 10=#4ce3ae
palette = 11=#fccab0
palette = 12=#4ccce6
palette = 13=#f587c1
palette = 14=#80eef0
palette = 15=#ffffff

background-opacity = 0.80
background-blur = 28
window-colorspace = display-p3
alpha-blending = linear-corrected
macos-titlebar-style = transparent
window-padding-x = 16
window-padding-y = 14
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.2
font-thicken = true
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.84
split-divider-color = #333545
