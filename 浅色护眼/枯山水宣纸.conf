# ============================================================
# 风格：枯山水宣纸（Kanso Pearl 日式极简浅色）
# 氛围：温润珍珠宣纸白 + 矿物墨青/赭红/苔绿，极度克制高级的日式枯山水留白
# 优化点：去噪降饱和，长时间在明亮办公室使用毫无刺眼感
# ============================================================

background = #f2f1ef
foreground = #22262d
cursor-color = #4d699b
cursor-text = #f2f1ef
selection-background = #d9d8d2
selection-foreground = #14171c

palette = 0=#22262d
palette = 1=#c84053
palette = 2=#6f894e
palette = 3=#b07c2e
palette = 4=#4d699b
palette = 5=#9b5b82
palette = 6=#597b75
palette = 7=#5c6068
palette = 8=#7e828c
palette = 9=#d95567
palette = 10=#7f9c5b
palette = 11=#c48d39
palette = 12=#5f7eb5
palette = 13=#b06c96
palette = 14=#6b918a
palette = 15=#14171c

window-colorspace = display-p3
alpha-blending = linear-corrected
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.88
split-divider-color = #dedcd6
