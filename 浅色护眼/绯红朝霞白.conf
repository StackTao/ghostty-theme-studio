# ============================================================
# 风格：绯红朝霞白（Horizon Bright 优化版）
# 氛围：带着淡淡桃花奶油暖调的朝霞白底 + 珊瑚绯红 + 清透青绿，温柔又有活力
# 优化点：加深浅底黄/青对比度，确保白天高亮度下代码依然犀利清晰
# ============================================================

background = #fdf0ed
foreground = #1e2029
cursor-color = #e9436f
cursor-text = #fdf0ed
selection-background = #f7d5cc
selection-foreground = #16161d

palette = 0=#1e2029
palette = 1=#e9436f
palette = 2=#00a870
palette = 3=#c97448
palette = 4=#009ab5
palette = 5=#db3e92
palette = 6=#00a19f
palette = 7=#5a5661
palette = 8=#857e8a
palette = 9=#fc5682
palette = 10=#00bd7e
palette = 11=#de8759
palette = 12=#00b2cf
palette = 13=#f056a8
palette = 14=#00b8b6
palette = 15=#16161d

window-colorspace = display-p3
alpha-blending = linear-corrected
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.88
split-divider-color = #f0ded9
