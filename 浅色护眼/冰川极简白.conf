# ============================================================
# 风格：冰川极简白（Nordic Snow / GitHub 融合优化版）
# 氛围：冷冽干净的北欧冰川白 + 精密科技蓝，适合文档与高密度排错
# 优化点：
#   1. 摒弃刺眼纯白 #ffffff，使用柔和雪雾白 #f6f8fa
#   2. 所有彩色均保证 AA 级以上浅底可读性，清爽利落
# ============================================================

background = #f6f8fa
foreground = #24292f
cursor-color = #0969da
cursor-text = #f6f8fa
selection-background = #cce2ff
selection-foreground = #1b1f24

# ANSI 标准 0-7
palette = 0=#24292f
palette = 1=#cf222e
palette = 2=#1a7f37
palette = 3=#9a6700
palette = 4=#0969da
palette = 5=#8250df
palette = 6=#1b7c83
palette = 7=#57606a

# ANSI 亮色 8-15
palette = 8=#768390
palette = 9=#a40e26
palette = 10=#2da44e
palette = 11=#bf8700
palette = 12=#218bff
palette = 13=#a475f9
palette = 14=#3192aa
palette = 15=#1b1f24

# 质感与细节优化
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.1
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.88
split-divider-color = #d8dee4
