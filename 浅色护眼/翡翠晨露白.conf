# ============================================================
# 风格：翡翠晨露白（Lumina Aurora Light 优化版）
# 氛围：带有一丝丝薄荷玉色的极清透淡青白底 + 沉稳墨青字，夏日清凉感扑面而来
# 优化点：微调高亮组明度，让所有彩色日志在薄荷玉底上保持极高清晰度
# ============================================================

background = #f2faf9
foreground = #163236
cursor-color = #007386
cursor-text = #f2faf9
selection-background = #c4e3da
selection-foreground = #0e2427

palette = 0=#163236
palette = 1=#b83633
palette = 2=#027a4b
palette = 3=#a86812
palette = 4=#2c6496
palette = 5=#8e4a88
palette = 6=#007a8f
palette = 7=#4e6d72
palette = 8=#638286
palette = 9=#cf4642
palette = 10=#0a945e
palette = 11=#bf7919
palette = 12=#3c79b0
palette = 13=#a35c9c
palette = 14=#0a93ab
palette = 15=#0e2427

window-colorspace = display-p3
alpha-blending = linear-corrected
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.88
split-divider-color = #d8ebe8
