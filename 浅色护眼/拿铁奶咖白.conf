# ============================================================
# 风格：拿铁奶咖白（Catppuccin Latte 优化版）
# 氛围：顺滑牛奶灰白底 + 莫兰迪高辨识度彩铅色，清爽高级
# 优化点：
#   1. 修复内置版选区过艳（橘粉色块）的问题，改为清透冷灰蓝选区 #ccd0da
#   2. 加深注释色 palette 8，让补全提示与灰色输出在亮屏下清晰可见
# ============================================================

background = #eff1f5
foreground = #4c4f69
cursor-color = #dc8a78
cursor-text = #eff1f5
selection-background = #ccd0da
selection-foreground = #2c2e42

# ANSI 标准 0-7
palette = 0=#5c5f77
palette = 1=#d20f39
palette = 2=#40a02b
palette = 3=#cc7e14
palette = 4=#1e66f5
palette = 5=#c74ca8
palette = 6=#179299
palette = 7=#6c6f85

# ANSI 亮色 8-15
palette = 8=#8c8fa1
palette = 9=#e6224b
palette = 10=#4eb337
palette = 11=#df8e1d
palette = 12=#3878f6
palette = 13=#db62bc
palette = 14=#1ca6ae
palette = 15=#2c2e42

# 质感与细节优化
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.1
cursor-style = block
cursor-style-blink = true
unfocused-split-opacity = 0.88
split-divider-color = #dce0e8
