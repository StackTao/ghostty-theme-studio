# ============================================================
# 风格：抹茶禅意白（Matcha Zen 修复优化版）
# 氛围：淡雅日式抹茶宣纸白 + 沉稳茶褐青绿，清心护眼不发刺
# 优化点：
#   1. 彻底修复内置版「浅灰字在浅绿选区上几乎看不清」的致命 Bug
#   2. 稍微压深黄色/青色在浅底上的对比度，让命令行高亮更利落
# ============================================================

background = #f5f7ec
foreground = #2f3a25
cursor-color = #4a852b
cursor-text = #f5f7ec
selection-background = #d2e0be
selection-foreground = #1e2617

# ANSI 标准 0-7
palette = 0=#2f3a25
palette = 1=#ba4027
palette = 2=#447f27
palette = 3=#8c6900
palette = 4=#296f6b
palette = 5=#75529c
palette = 6=#237878
palette = 7=#5a694e

# ANSI 亮色 8-15
palette = 8=#7f9171
palette = 9=#cf4e34
palette = 10=#559634
palette = 11=#a6581c
palette = 12=#348782
palette = 13=#8964b3
palette = 14=#2d9191
palette = 15=#1e2617

# 质感与细节优化
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
cursor-style = block
cursor-style-blink = false
unfocused-split-opacity = 0.88
split-divider-color = #dce3ce
