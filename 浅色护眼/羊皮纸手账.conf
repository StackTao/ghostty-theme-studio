# ============================================================
# 风格：羊皮纸手账（Flexoki Light 优化版）
# 氛围：Obsidian 作者 Steph Ango 纸墨美学，米暖纸张 + 钢笔彩墨
# 优化点：
#   1. 微调注释与选区对比度，保留温润纸感同时保证白日强光下极易阅读
#   2. 光标改用温暖朱砂墨色 #bc5215，复古文具质感
# ============================================================

background = #fffcf0
foreground = #1c1b1a
cursor-color = #bc5215
cursor-text = #fffcf0
selection-background = #e6e2d1
selection-foreground = #100f0f

# ANSI 标准 0-7
palette = 0=#282726
palette = 1=#af3029
palette = 2=#66800b
palette = 3=#ad8301
palette = 4=#205ea6
palette = 5=#a02f6f
palette = 6=#24837b
palette = 7=#6f6e69

# ANSI 亮色 8-15
palette = 8=#878580
palette = 9=#d14d41
palette = 10=#879a39
palette = 11=#d0a215
palette = 12=#4385be
palette = 13=#ce5d97
palette = 14=#3aa99f
palette = 15=#100f0f

# 质感与细节优化
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.1
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.88
split-divider-color = #e6e4d9
