# ============================================================
# 风格：清晨玫瑰雾（Rosé Pine Dawn 优化版）
# 氛围：奶油燕麦暖白 + 玫瑰豆沙 + 雾霭松蓝，极具设计感杂志风
# 优化点：
#   1. 提深高亮组饱和度，防止浅底终端下日志颜色显得发白无力
#   2. 光标设为温柔豆沙红 #b4637a，选区采用温润藕粉灰 #e4dce0
# ============================================================

background = #faf4ed
foreground = #4e496e
cursor-color = #b4637a
cursor-text = #faf4ed
selection-background = #e4dce0
selection-foreground = #3c3759

# ANSI 标准 0-7
palette = 0=#575279
palette = 1=#b4637a
palette = 2=#286983
palette = 3=#c77d1c
palette = 4=#427d87
palette = 5=#846ba0
palette = 6=#c46c68
palette = 7=#6e6a86

# ANSI 亮色 8-15
palette = 8=#8d879e
palette = 9=#c94f72
palette = 10=#1f7b9e
palette = 11=#d98a26
palette = 12=#4c919c
palette = 13=#9779b8
palette = 14=#d67d79
palette = 15=#3c3759

# 质感与细节优化
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.1
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.88
split-divider-color = #e8e0d8
