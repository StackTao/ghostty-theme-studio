# ============================================================
# 风格：暖杏晨光（Ayu Light 优化版）
# 氛围：清新奶油暖白 + 标志性暖杏橘光标 + 利落天空蓝与草木绿，干净轻盈
# 优化点：修复内置版选区过深刺眼问题，改为柔和浅天蓝选区 #d1e4f4
# ============================================================

background = #fafafa
foreground = #4f555b
cursor-color = #ff9940
cursor-text = #fafafa
selection-background = #d1e4f4
selection-foreground = #1e2226

palette = 0=#3a3f45
palette = 1=#f07171
palette = 2=#6cbf43
palette = 3=#e69f2e
palette = 4=#399ee6
palette = 5=#a37acc
palette = 6=#4cbf99
palette = 7=#6c737a
palette = 8=#8a9199
palette = 9=#ff8585
palette = 10=#80cf57
palette = 11=#f2ae49
palette = 12=#55b4d4
palette = 13=#b891e0
palette = 14=#5ed1ac
palette = 15=#2b3036

window-colorspace = display-p3
alpha-blending = linear-corrected
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.88
split-divider-color = #e6e8eb
