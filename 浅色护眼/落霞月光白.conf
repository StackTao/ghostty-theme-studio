# ============================================================
# 风格：落霞月光白（Sequoia Moonlight Light 优化版）
# 氛围：苹果红杉极简银灰白 + 淡薰衣草紫 + 珊瑚橙与天青蓝，极具现代设计审美
# 优化点：修复内置版选区过深偏灰紫导致文字压暗的问题
# ============================================================

background = #f0f1f5
foreground = #282930
cursor-color = #8c56d1
cursor-text = #f0f1f5
selection-background = #dad4eb
selection-foreground = #1b1c22

palette = 0=#282930
palette = 1=#c94da8
palette = 2=#3b82d6
palette = 3=#b07232
palette = 4=#8c56d1
palette = 5=#b54d8f
palette = 6=#2f8f8c
palette = 7=#575861
palette = 8=#787985
palette = 9=#de62bd
palette = 10=#5298eb
palette = 11=#c9843e
palette = 12=#a16ce6
palette = 13=#cc62a6
palette = 14=#41a6a3
palette = 15=#1b1c22

window-colorspace = display-p3
alpha-blending = linear-corrected
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.88
split-divider-color = #dcdde3
