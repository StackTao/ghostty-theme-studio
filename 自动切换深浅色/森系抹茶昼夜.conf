# ============================================================
# 自动明暗切换：森系抹茶昼夜（Everforest + Matcha 护眼双拼）
# 效果：自动跟随 macOS 外观模式，白天「抹茶禅意白」，夜晚「森系常青林」
# 亮点：两套均为低饱和度护眼绿色系，昼夜切换毫无割裂感
# 使用方式：在 ~/.config/ghostty/config 中写入：
#   config-file = 自动切换深浅色/森系抹茶昼夜.conf
# ============================================================

theme = dark:深色经典/森系常青林.conf,light:浅色护眼/抹茶禅意白.conf

window-theme = auto
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
cursor-style = block
cursor-style-blink = false
unfocused-split-opacity = 0.86
