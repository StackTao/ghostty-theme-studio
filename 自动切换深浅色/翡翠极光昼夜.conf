# ============================================================
# 自动明暗切换：翡翠极光昼夜（Lumina Aurora 翡翠清透双拼）
# 效果：白天「翡翠晨露白」清凉玉色，夜晚「Lumina Aurora Dark」深海翡翠极光
# 使用方式：在 ~/.config/ghostty/config 中写入：
#   config-file = 自动切换深浅色/翡翠极光昼夜.conf
# ============================================================

theme = dark:Lumina Aurora Dark,light:浅色护眼/翡翠晨露白.conf

background-opacity = 0.90
background-blur = 20
window-theme = auto
window-colorspace = display-p3
alpha-blending = linear-corrected
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
font-thicken = true
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.85
