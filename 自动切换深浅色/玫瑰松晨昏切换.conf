# ============================================================
# 自动明暗切换：玫瑰松晨昏切换（Rosé Pine 优化双拼）
# 效果：自动跟随 macOS 外观模式，白天「清晨玫瑰雾」，夜晚「暗夜玫瑰松」
# 使用方式：在 ~/.config/ghostty/config 中写入：
#   config-file = 自动切换深浅色/玫瑰松晨昏切换.conf
# ============================================================

theme = dark:深色经典/暗夜玫瑰松.conf,light:浅色护眼/清晨玫瑰雾.conf

window-theme = auto
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.1
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.85
