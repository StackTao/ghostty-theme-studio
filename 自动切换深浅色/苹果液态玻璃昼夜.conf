# ============================================================
# 自动明暗切换：苹果液态玻璃昼夜（macOS 26+ Liquid Glass 自动明暗）
# 效果：自动跟随 macOS 外观模式，白天浅色液态玻璃、夜晚深色液态玻璃
# 亮点：原生 `macos-glass-regular` + `iglass Dark/Light` + `display-p3`
# 使用方式：在 ~/.config/ghostty/config 中写入：
#   config-file = 自动切换深浅色/苹果液态玻璃昼夜.conf
# ============================================================

theme = dark:iglass Dark,light:iglass Light

background-opacity = 0.78
background-blur = macos-glass-regular
window-theme = auto
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 16
window-padding-y = 14
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.25
font-thicken = true
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.84
