# ============================================================
# 自动明暗切换：东京夜与冰川白昼夜（高对比极客双拼）
# 效果：自动跟随 macOS 外观模式，白天「冰川极简白」，夜晚「东京霓虹夜」
# 亮点：白天清爽冷静、夜晚沉浸电光，适合长时间高强度编码
# 使用方式：在 ~/.config/ghostty/config 中写入：
#   config-file = 自动切换深浅色/东京夜与冰川白昼夜.conf
# ============================================================

theme = dark:深色经典/东京霓虹夜.conf,light:浅色护眼/冰川极简白.conf

window-theme = auto
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.1
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.84
