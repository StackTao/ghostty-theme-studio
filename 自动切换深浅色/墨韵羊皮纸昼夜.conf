# ============================================================
# 自动明暗切换：墨韵羊皮纸昼夜（Flexoki 纸墨美学双拼）
# 效果：自动跟随 macOS 外观模式，白天「羊皮纸手账」，夜晚「Flexoki Dark 墨黑」
# 使用方式：在 ~/.config/ghostty/config 中写入：
#   config-file = 自动切换深浅色/墨韵羊皮纸昼夜.conf
# ============================================================

theme = dark:Flexoki Dark,light:浅色护眼/羊皮纸手账.conf

window-theme = auto
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.1
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.86
