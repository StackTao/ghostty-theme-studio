# ============================================================
# 自动明暗切换：落霞月光昼夜（macOS 红杉极简双拼）
# 效果：白天「落霞月光白」苹果红杉银白，夜晚「Sequoia Moonlight Dark」深空月光，轻磨砂质感
# 使用方式：在 ~/.config/ghostty/config 中写入：
#   config-file = 自动切换深浅色/落霞月光昼夜.conf
# ============================================================

theme = dark:Sequoia Moonlight Dark,light:浅色护眼/落霞月光白.conf

background-opacity = 0.86
background-blur = macos-glass-regular
window-theme = auto
window-colorspace = display-p3
alpha-blending = linear-corrected
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
font-thicken = true
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.85
