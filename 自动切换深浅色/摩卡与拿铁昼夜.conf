# ============================================================
# 自动明暗切换：摩卡与拿铁昼夜（Catppuccin 优化双拼）
# 效果：自动跟随 macOS 外观模式，白天「拿铁奶咖白」，夜晚「摩卡可可粉」
# 使用方式：在 ~/.config/ghostty/config 中写入：
#   config-file = 自动切换深浅色/摩卡与拿铁昼夜.conf
# ============================================================

theme = dark:深色经典/摩卡可可粉.conf,light:浅色护眼/拿铁奶咖白.conf

window-theme = auto
window-colorspace = display-p3
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.1
cursor-style = block
cursor-style-blink = true
unfocused-split-opacity = 0.85
