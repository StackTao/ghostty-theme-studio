# ============================================================
# 自动明暗切换：绯红朝霞昼夜（Horizon 电影晚霞与朝霞双拼）
# 效果：白天「绯红朝霞白」温暖奶油桃花，夜晚「落日绯红」深酒炭晚霞
# 使用方式：在 ~/.config/ghostty/config 中写入：
#   config-file = 自动切换深浅色/绯红朝霞昼夜.conf
# ============================================================

theme = dark:深色经典/落日绯红.conf,light:浅色护眼/绯红朝霞白.conf

window-theme = auto
window-colorspace = display-p3
alpha-blending = linear-corrected
macos-titlebar-style = transparent
window-padding-x = 14
window-padding-y = 12
window-padding-balance = true
window-padding-color = extend
minimum-contrast = 1.15
cursor-style = bar
cursor-style-blink = true
unfocused-split-opacity = 0.85
